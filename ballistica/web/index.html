<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ballistica</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#c1440e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ballistica">
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #555555;
    --line: #cccccc;
    --accent: #c1440e;
    --accent-text: #ffffff;
    --field-bg: #f4f4f4;
    --error-bg: #ffe4e1;
    --error-text: #8b0000;
    --ok-bg: #eef7ee;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding: 14px 14px 40px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 4px 0 14px; text-align: center; letter-spacing: 0.5px; }
  h2 { font-size: 15px; margin: 4px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; margin-bottom: 4px; }
  .field { display: inline-flex; flex-direction: column; flex-shrink: 0; }
  .field label {
    font-weight: 700; font-size: 11px; color: var(--muted); margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.2px; line-height: 1.15;
    /* Labels read as short words (title="..." on the input carries the unit),
       but this is a defensive net: a narrow field's label wraps or breaks
       instead of ever overflowing into the next field -- nowrap here was
       exactly what caused labels to spill sideways and overlap neighbors. */
    overflow-wrap: anywhere; white-space: normal;
  }
  input, select {
    font-size: 18px; padding: 8px 8px; min-height: 42px;
    border: 2px solid var(--line); border-radius: 8px; background: var(--field-bg); color: var(--text);
  }
  select { -webkit-appearance: none; appearance: none; }
  input:focus, select:focus { outline: 3px solid var(--accent); border-color: var(--accent); }
  /* Native number-input spin arrows eat real width from already-narrow
     fields (a box sized to hold "59" doesn't have room left over for
     spin buttons too) -- typing is faster than tapping them anyway. */
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* content-sized field widths -- not uniform, sized to what each value actually holds */
  .w-xs  { width: 6ch; }   /* temp (incl. sign), humidity, wind speed, wind clock -- empirically fits "-12", "100", "999" without clipping */
  .w-sm  { width: 8ch; }   /* altitude, pressure, BC, velocity, zero, powder charge, click value, distance, bullet weight, barrel length -- fits "29.92", "0.999" */
  .w-md  { width: 10ch; }    /* twist rate, drag model */
  .w-lg  { flex: 1 1 16ch; min-width: 14ch; } /* caliber, powder, bullet type, load name, notes */
  .w-full { width: 100%; }

  .field.w-lg { flex: 1 1 16ch; }
  .field.w-full { width: 100%; flex-basis: 100%; }

  button {
    font-size: 17px; font-weight: 700; padding: 10px 16px; min-height: 46px;
    background: var(--field-bg); color: var(--text);
    border: 2px solid var(--line); border-radius: 8px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.big { width: 100%; font-size: 22px; min-height: 58px; margin-top: 4px; }
  button:active { opacity: 0.85; }

  /* Addendum 35: a native <select> with appearance:none has no visual
     affordance signaling it's tappable -- Rick never noticed it was
     there. Reusing the same details/summary pattern as the other
     panels below makes "tap to expand a list" obvious and consistent
     with the rest of the app, and doubles as a plain, always-visible
     way to confirm what's actually saved (Addendum 34's diagnostic ask). */
  .rifle-picker-details { margin-top: 0; margin-bottom: 8px; }
  .rifle-picker-details > summary { font-size: 20px; font-weight: 700; color: var(--text); padding: 12px 14px; }
  .rifle-picker-details > summary::before { content: "\25B8  "; color: var(--muted); font-size: 14px; }
  .rifle-picker-details[open] > summary::before { content: "\25BE  "; }
  .rifle-list-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    width: 100%; text-align: left; padding: 12px 10px; font-size: 17px;
    border: none; border-top: 1px solid var(--line); border-radius: 0;
    background: transparent; color: var(--text); min-height: 0;
  }
  .rifle-list-row:first-child { border-top: none; }
  .rifle-list-row.active { font-weight: 700; color: var(--accent); }
  .rifle-list-row span:last-child { font-size: 14px; color: var(--muted); font-weight: 400; }
  .rifle-list-row.active span:last-child { color: var(--accent); }
  .rifle-list-empty { padding: 8px 10px; color: var(--muted); font-size: 15px; }
  .rifle-actions { display: flex; gap: 8px; margin-bottom: 6px; }
  .rifle-actions button { flex: 1; min-height: 46px; }

  .load-header { display: flex; gap: 8px; align-items: center; margin: 14px 0 6px; }
  .load-header select { flex: 1; font-size: 18px; min-height: 46px; }

  details { margin-top: 10px; border: 2px solid var(--line); border-radius: 10px; }
  summary { padding: 10px 14px; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "\25B8  "; }
  details[open] summary::before { content: "\25BE  "; }
  .panel-body { padding: 4px 14px 14px; }

  hr.sep { border: none; border-top: 2px solid var(--line); margin: 18px 0; }

  #calcError, #rifleError, #loadError {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 8px;
    background: var(--error-bg); color: var(--error-text); font-weight: 600; font-size: 15px;
  }
  #rifleOk, #loadOk {
    display: none; margin-top: 10px; padding: 8px 12px; border-radius: 8px;
    background: var(--ok-bg); color: #2a6b2a; font-weight: 600; font-size: 14px;
  }

  #result { display: none; margin-top: 20px; }
  .result-card { border: 2px solid var(--text); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .result-card .label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .result-card .big { font-size: 46px; font-weight: 800; line-height: 1.1; margin: 2px 0; }
  .result-card .sub { font-size: 17px; color: var(--muted); }
  .meta { text-align: center; color: var(--muted); font-size: 15px; margin-top: 8px; }

  #status { text-align: center; color: var(--muted); font-size: 14px; margin-top: 4px; min-height: 18px; }

  .voice-panel {
    border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px;
    margin-bottom: 16px; text-align: center;
  }
  .voice-panel .state-line { font-size: 15px; font-weight: 700; color: var(--muted); min-height: 20px; }
  .voice-panel .state-line.hot { color: var(--accent); }
  .voice-panel .heard-line { font-size: 14px; color: var(--muted); font-style: italic; min-height: 18px; margin-top: 2px; }
  #enableVoiceBtn { margin-top: 8px; }
  #voiceUnsupported { display: none; color: var(--error-text); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>BALLISTICA</h1>

  <div class="voice-panel">
    <div class="state-line" id="voiceState">Voice: off</div>
    <div class="heard-line" id="voiceHeard"></div>
    <button id="enableVoiceBtn" class="primary">Enable voice ("Ballistica")</button>
    <div id="voiceUnsupported">This browser doesn't support wake-word listening (needs Chrome). Use the manual controls below instead.</div>
  </div>

  <details id="riflePicker" class="rifle-picker-details">
    <summary><span id="riflePickerLabel">Loading rifles...</span></summary>
    <div class="panel-body" id="riflePickerList"></div>
  </details>
  <div class="rifle-actions">
    <button id="newRifleBtn" title="New rifle">+ New</button>
    <button id="editRifleBtn" title="Edit this rifle">Edit</button>
  </div>

  <details id="rifleDetails">
    <summary>Rifle setup</summary>
    <div class="panel-body">
      <div class="field w-full">
        <label for="rName">Gun name</label>
        <input id="rName" type="text" placeholder="e.g. AR-15 20in Faxon">
      </div>
      <div class="row">
        <div class="field w-md"><label for="rCaliber">Caliber</label><input id="rCaliber" type="text" placeholder="e.g. .223 Wylde"></div>
        <div class="field w-sm"><label for="rBarrel">Barrel</label><input id="rBarrel" type="number" step="0.1" title="Barrel length, inches"></div>
        <div class="field w-md"><label for="rTwist">Twist rate</label><input id="rTwist" type="text" placeholder="e.g. 1:7"></div>
        <div class="field w-sm"><label for="rScope">Scope ht</label><input id="rScope" type="number" step="0.1" title="Scope height over bore, inches"></div>
        <div class="field w-md">
          <label for="rReticle">Reticle unit</label>
          <select id="rReticle"><option value="MRAD">MRAD</option><option value="MOA">MOA</option></select>
        </div>
        <div class="field w-sm"><label for="rClick">Click</label><input id="rClick" type="number" step="0.01" value="0.1" title="Click value, in the reticle unit above"></div>
        <div class="field w-md">
          <label for="rOpticType">Optic type</label>
          <select id="rOpticType"><option value="">Unknown</option><option value="scope">Scope</option><option value="red_dot">Red dot</option></select>
        </div>
      </div>
      <div class="row">
        <div class="field w-lg"><label for="rScopeMake">Make</label><input id="rScopeMake" type="text" placeholder="e.g. Vortex, Holosun"></div>
        <div class="field w-lg"><label for="rScopeModel">Model</label><input id="rScopeModel" type="text" placeholder="e.g. Viper PST Gen II 5-25x50, 510C"></div>
      </div>
      <div class="row">
        <div class="field w-md">
          <label for="rSuppressor">Suppressor</label>
          <select id="rSuppressor"><option value="no">No</option><option value="yes">Yes</option></select>
        </div>
        <div class="field w-lg" id="rSuppressorTypeField" style="display:none">
          <label for="rSuppressorType">Type / brand</label>
          <input id="rSuppressorType" type="text" placeholder="e.g. Dead Air Sandman-S, or 'custom build'">
        </div>
      </div>
      <div class="row">
        <div class="field w-md"><label for="rMag">Power</label><input id="rMag" type="text" placeholder="5-25x" title="Magnification -- magnified scopes only, e.g. 5-25x or a fixed 10x"></div>
        <div class="field w-sm"><label for="rObjective">Objective</label><input id="rObjective" type="number" step="1" title="Objective lens diameter, mm"></div>
        <div class="field w-md">
          <label for="rFocalPlane">Focal plane</label>
          <select id="rFocalPlane"><option value="">Unknown</option><option value="FFP">FFP</option><option value="SFP">SFP</option></select>
        </div>
        <div class="field w-sm"><label for="rDotSize">Dot size</label><input id="rDotSize" type="number" step="0.5" title="Red dot only -- dot size, MOA"></div>
        <div class="field w-lg"><label for="rReticleType">Reticle type</label><input id="rReticleType" type="text" placeholder="e.g. MOA Christmas tree, or 65 MOA circle + dot"></div>
      </div>
      <button id="saveRifleBtn" class="primary">Save rifle</button>
      <button id="deleteRifleBtn" style="display:none">Delete rifle</button>
      <div id="rifleOk"></div>
      <div id="rifleError"></div>
    </div>
  </details>

  <div class="load-header">
    <select id="loadSelect"></select>
    <button id="newLoadBtn" title="New load">+ New</button>
  </div>

  <details id="loadDetails">
    <summary>Load setup</summary>
    <div class="panel-body">
      <div class="row">
        <div class="field w-lg"><label for="lName">Load name</label><input id="lName" type="text" placeholder="e.g. 23.5gr H335"></div>
      </div>
      <div class="row">
        <div class="field w-lg"><label for="lBulletType">Bullet type</label><input id="lBulletType" type="text" placeholder="e.g. 77gr Sierra MatchKing"></div>
        <div class="field w-sm"><label for="lBulletWt">Wt</label><input id="lBulletWt" type="number" step="1" title="Bullet weight, grains"></div>
      </div>
      <div class="row">
        <div class="field w-sm"><label for="lBC">BC</label><input id="lBC" type="number" step="0.001" placeholder="e.g. 0.362"></div>
        <div class="field w-md">
          <label for="lDragModel">Drag model</label>
          <select id="lDragModel"><option value="G1">G1</option><option value="G7">G7</option></select>
        </div>
        <div class="field w-sm"><label for="lMV">MV</label><input id="lMV" type="number" step="1" title="Muzzle velocity, fps"></div>
        <div class="field w-sm"><label for="lZero">Zero</label><input id="lZero" type="number" step="1" title="Zero distance, yards"></div>
      </div>
      <div class="row">
        <div class="field w-lg"><label for="lPowder">Powder</label><input id="lPowder" type="text" placeholder="e.g. H335"></div>
        <div class="field w-sm"><label for="lCharge">Charge</label><input id="lCharge" type="number" step="0.1" title="Powder charge, grains"></div>
      </div>
      <div class="row">
        <div class="field w-lg"><label for="lNotes">Notes</label><input id="lNotes" type="text"></div>
      </div>
      <button id="saveLoadBtn" class="primary">Save load</button>
      <div id="loadOk"></div>
      <div id="loadError"></div>
    </div>
  </details>

  <hr class="sep">

  <div class="row">
    <div class="field w-sm"><label for="rangeInput">Distance</label><input id="rangeInput" type="number" inputmode="decimal" min="0" step="1" placeholder="400" title="Target distance, yards"></div>
    <button id="solveBtn" class="primary">GET SOLUTION</button>
  </div>
  <div id="status"></div>
  <div id="calcError"></div>

  <details id="condDetails">
    <summary>Conditions (optional)</summary>
    <div class="panel-body">
      <div class="row">
        <div class="field w-xs"><label>Temp</label><input id="tempF" type="number" value="59" title="Temperature, degrees F"></div>
        <div class="field w-xs"><label>Humid</label><input id="humidPct" type="number" value="0" title="Relative humidity, %"></div>
        <div class="field w-xs"><label>Wind</label><input id="windMph" type="number" value="0" title="Wind speed, mph"></div>
      </div>
      <div class="row">
        <div class="field w-sm"><label>Alt</label><input id="altFt" type="number" value="0" title="Altitude, feet"></div>
        <div class="field w-sm"><label>Press</label><input id="pressInHg" type="number" step="0.01" placeholder="auto" title="Barometric pressure, inHg -- leave blank to estimate from altitude"></div>
        <div class="field w-xs"><label>Clock</label><input id="windClock" type="number" min="0" max="12" step="0.5" value="12" title="Wind direction: 12 = headwind, 3 = from the right, 9 = from the left"></div>
      </div>
    </div>
  </details>

  <div id="result">
    <div class="result-card">
      <div class="label">Drop (dial/hold up)</div>
      <div class="big" id="dropIn">--</div>
      <div class="sub" id="dropSub">--</div>
    </div>
    <div class="result-card">
      <div class="label">Windage</div>
      <div class="big" id="windIn">--</div>
      <div class="sub" id="windSub">--</div>
    </div>
    <div class="meta" id="velMeta"></div>
  </div>

<script>
const loadSelect = document.getElementById('loadSelect');
const rangeInput = document.getElementById('rangeInput');
const solveBtn = document.getElementById('solveBtn');
const statusEl = document.getElementById('status');
const calcError = document.getElementById('calcError');
const resultEl = document.getElementById('result');
const rifleDetails = document.getElementById('rifleDetails');
const loadDetails = document.getElementById('loadDetails');

let currentRifleDetail = null;
let allRifles = []; // [{name, active_load_name, load_count}] -- this listing never
                     // requires an active load to exist (Addendum 36: zero loads is
                     // a valid rifle state), unlike the per-rifle detail fetch below.

function flash(el, msg, ms) {
  el.textContent = msg;
  el.style.display = 'block';
  if (ms) setTimeout(() => { el.style.display = 'none'; }, ms);
}
function hide(el) { el.style.display = 'none'; }
function setStatus(msg) { statusEl.textContent = msg; }

async function api(path, options) {
  let res;
  try {
    res = await fetch(path, options);
  } catch (e) {
    throw new Error('Network error -- check the connection and try again.');
  }
  let body;
  try { body = await res.json(); } catch (e) { body = null; }
  if (!res.ok) {
    const detail = body && body.detail ? body.detail : `HTTP ${res.status}`;
    throw new Error(detail);
  }
  return body;
}

async function loadRifles(selectName) {
  setStatus('Loading rifles...');
  try {
    allRifles = await api('/rifles');
    if (!allRifles.length) {
      currentRifleDetail = null;
      renderRiflePicker();
      openRifleFormBlank();
      setStatus('');
      return;
    }
    if (!selectName) {
      // No explicit hint -- ask which rifle is actually active rather
      // than defaulting to "first in the list" (Addendum 34: that
      // default could silently skip right past a rifle that was just
      // created and made active). /status 404s when the active rifle
      // has no active load yet -- normal for a rifle just created by
      // voice before any load exists (Addendum 36) -- so this falls
      // through to the existing-detail/first-item fallback below rather
      // than failing the whole refresh.
      try {
        selectName = (await api('/status')).rifle.name;
      } catch (e) { /* fall through */ }
    }
    const stillExists = (name) => name && allRifles.some(r => r.name === name);
    const name = stillExists(selectName) ? selectName
      : stillExists(currentRifleDetail && currentRifleDetail.name) ? currentRifleDetail.name
      : allRifles[0].name;
    await loadRifleDetail(name);
  } catch (e) {
    flash(calcError, 'Could not reach Ballistica: ' + e.message);
  }
  setStatus('');
}

async function loadRifleDetail(name) {
  currentRifleDetail = await api('/rifles/' + encodeURIComponent(name));
  loadSelect.innerHTML = currentRifleDetail.loads.map(l =>
    `<option value="${l.name}" ${l.name === currentRifleDetail.active_load_name ? 'selected' : ''}>${l.name}</option>`
  ).join('');
  fillRifleForm(currentRifleDetail);
  if (currentRifleDetail.loads.length) {
    fillLoadForm(currentRifleDetail.loads.find(l => l.name === loadSelect.value) || currentRifleDetail.loads[0]);
  } else {
    openLoadFormBlank();
  }
  renderRiflePicker();
}

// Addendum 35: a visible, always-current list of every saved rifle --
// also the diagnostic Rick asked for to independently confirm whether a
// rifle actually exists server-side, instead of only trusting whatever
// confirmation message a voice command gave (Addendum 34).
function renderRiflePicker() {
  document.getElementById('riflePickerLabel').textContent =
    currentRifleDetail ? currentRifleDetail.name : (allRifles.length ? 'Select a rifle' : 'No rifles saved yet');
  const list = document.getElementById('riflePickerList');
  if (!allRifles.length) {
    list.innerHTML = '<div class="rifle-list-empty">No saved rifles yet -- use + New below.</div>';
    return;
  }
  list.innerHTML = allRifles.map(r => {
    const active = currentRifleDetail && r.name === currentRifleDetail.name;
    // load_count shown here directly answers "did that load I just saved
    // really attach to this rifle" without opening the rifle at all.
    return `<button type="button" class="rifle-list-row${active ? ' active' : ''}" data-name="${r.name.replace(/"/g, '&quot;')}">` +
      `<span>${r.name}</span><span>${r.load_count} load${r.load_count === 1 ? '' : 's'}${active ? '  ✓' : ''}</span></button>`;
  }).join('');
  list.querySelectorAll('.rifle-list-row').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.name;
      document.getElementById('riflePicker').open = false;
      if (currentRifleDetail && name === currentRifleDetail.name) return;
      hide(calcError);
      try {
        await loadRifleDetail(name);
      } catch (e) {
        flash(calcError, 'Could not load that rifle: ' + e.message);
      }
    });
  });
}

function fillRifleForm(r) {
  document.getElementById('rName').value = r.name;
  document.getElementById('rCaliber').value = r.caliber;
  document.getElementById('rBarrel').value = r.barrel_length_in ?? '';
  document.getElementById('rTwist').value = r.twist_rate;
  document.getElementById('rScope').value = r.scope_height_in;
  document.getElementById('rReticle').value = r.reticle_unit || 'MRAD';
  document.getElementById('rClick').value = r.click_value_mrad;
  document.getElementById('rOpticType').value = r.optic_type || '';
  document.getElementById('rScopeMake').value = r.scope_make || '';
  document.getElementById('rScopeModel').value = r.scope_model || '';
  document.getElementById('rMag').value = r.magnification || '';
  document.getElementById('rObjective').value = r.objective_lens_mm ?? '';
  document.getElementById('rFocalPlane').value = r.focal_plane || '';
  document.getElementById('rDotSize').value = r.dot_size_moa ?? '';
  document.getElementById('rReticleType').value = r.reticle_type || '';
  document.getElementById('rSuppressor').value = r.has_suppressor ? 'yes' : 'no';
  document.getElementById('rSuppressorType').value = r.suppressor_type || '';
  toggleSuppressorType();
  document.getElementById('deleteRifleBtn').style.display = '';
}
function toggleSuppressorType() {
  document.getElementById('rSuppressorTypeField').style.display =
    document.getElementById('rSuppressor').value === 'yes' ? '' : 'none';
}
document.getElementById('rSuppressor').addEventListener('change', toggleSuppressorType);
function openRifleFormBlank() {
  document.getElementById('rName').value = '';
  document.getElementById('rCaliber').value = '';
  document.getElementById('rBarrel').value = '';
  document.getElementById('rTwist').value = '';
  document.getElementById('rScope').value = '';
  document.getElementById('rReticle').value = 'MRAD';
  document.getElementById('rClick').value = '0.1';
  document.getElementById('rOpticType').value = '';
  document.getElementById('rScopeMake').value = '';
  document.getElementById('rScopeModel').value = '';
  document.getElementById('rMag').value = '';
  document.getElementById('rObjective').value = '';
  document.getElementById('rDotSize').value = '';
  document.getElementById('rFocalPlane').value = '';
  document.getElementById('rReticleType').value = '';
  document.getElementById('rSuppressor').value = 'no';
  document.getElementById('rSuppressorType').value = '';
  toggleSuppressorType();
  document.getElementById('deleteRifleBtn').style.display = 'none';
  rifleDetails.open = true;
}

function fillLoadForm(l) {
  document.getElementById('lName').value = l.name;
  document.getElementById('lBulletType').value = l.bullet_type || '';
  document.getElementById('lBulletWt').value = l.bullet_weight_gr;
  document.getElementById('lBC').value = l.bc;
  document.getElementById('lDragModel').value = l.drag_model;
  document.getElementById('lMV').value = l.muzzle_velocity_fps;

// ---------------------------------------------------------------- voice
// Two speech engines, deliberately: the browser's free, built-in
// SpeechRecognition runs continuously watching only for the wake word
// ("Ballistica") -- that's what makes always-on listening not cost
// money or ship a stream of background range-talk to a cloud API.
// Once the wake word fires, that recognizer stops and the actual
// command gets recorded properly and sent to OpenAI's Whisper via
// /voice/transcribe for better accuracy on numbers and ballistics
// terms, then /voice/query for the answer, then /voice/speak for the
// reply. One tap is unavoidable to arm this the first time (browsers
// require a user gesture before granting microphone access) -- after
// that it's hands-free until you tap again to disable it.

// In-session wakes stay terse/tactical -- these fire mid-string, between
// shots, where a shooter wants an ack and nothing else. Session start/stop
// get warmer phrasing instead (see GREETING_PHRASES/SIGNOFF_PHRASES below):
// that's the one moment that isn't live fire, so it can afford a sentence.
const ACK_PHRASES = [
  "Copy that, standing by.",
  "Ballistica up, go ahead.",
  "I'm here, Rick. Go ahead.",
];

const GREETING_PHRASES = [
  "Hey Rick, Ballistica's up. What are we working with today?",
  "Good to go, Rick -- what do you need?",
  "Ballistica's online. Let's get you dialed in.",
];

const SIGNOFF_PHRASES = [
  "Alright, standing down. Good shooting.",
  "Voice off -- catch you next session.",
  "That's a wrap. I'm here when you need me.",
];

let voiceEnabled = false;
let voiceState = 'off'; // off | idle | acknowledging | listening | processing | speaking
let wakeRecognition = null;
let sessionWakeCount = 0;

const voiceStateEl = document.getElementById('voiceState');
const voiceHeardEl = document.getElementById('voiceHeard');
const enableVoiceBtn = document.getElementById('enableVoiceBtn');
const voiceUnsupportedEl = document.getElementById('voiceUnsupported');

function setVoiceState(text, hot) {
  voiceStateEl.textContent = text;
  voiceStateEl.classList.toggle('hot', !!hot);
}

// Addendum 30: a single Audio element reused across every reply, instead
// of a fresh one per playback -- pairs with the persistent mic stream
// below, since repeatedly tearing down and recreating audio objects is
// the same class of thing suspected of causing the reported click/pop
// (an audio route re-negotiation) on Bluetooth earbuds.
let sharedAudioEl = null;

async function playAudioBlob(blob) {
  const url = URL.createObjectURL(blob);
  if (!sharedAudioEl) sharedAudioEl = new Audio();
  sharedAudioEl.src = url;
  await new Promise((resolve) => {
    sharedAudioEl.onended = resolve;
    sharedAudioEl.onerror = resolve;
    sharedAudioEl.play().catch(resolve);
  });
  URL.revokeObjectURL(url);
}

async function speak(text) {
  try {
    const res = await fetch('/voice/speak', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) return;
    await playAudioBlob(await res.blob());
  } catch (e) {
    // Voice output failing shouldn't break the loop -- the state line
    // still shows what was going on, silently.
  }
}

// Addendum 30 (root-caused from code, pending Rick's live confirmation):
// recordCommand() used to call getUserMedia() and tear the stream/
// AudioContext back down on EVERY voice turn, not once per session --
// during a multi-distance test that's a full mic acquire/release cycle
// per query, since a plain drop-at-range answer doesn't set
// awaiting_response and so exits handleWakeWord()'s loop after one
// turn. Repeatedly opening and closing mic access is a well-documented
// trigger for Bluetooth earbuds to audibly click as they renegotiate
// between the A2DP (media playback) and HFP (mic) profiles. Held open
// for the whole voice-enabled session instead -- acquired once in the
// enable-voice handler, released once in the disable handler -- so
// that renegotiation happens at most once per session rather than once
// per query.
let sharedMicStream = null;
let sharedAudioCtx = null;
let sharedAnalyser = null;

async function ensureMicStream() {
  if (sharedMicStream) return;
  sharedMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  sharedAudioCtx = new AudioCtx();
  sharedAnalyser = sharedAudioCtx.createAnalyser();
  sharedAnalyser.fftSize = 512;
  sharedAudioCtx.createMediaStreamSource(sharedMicStream).connect(sharedAnalyser);
}

function releaseMicStream() {
  if (sharedMicStream) sharedMicStream.getTracks().forEach(t => t.stop());
  sharedMicStream = null;
  if (sharedAudioCtx) { try { sharedAudioCtx.close(); } catch (e) {} }
  sharedAudioCtx = null;
  sharedAnalyser = null;
}

async function recordCommand() {
  await ensureMicStream();
  const mimeType = ['audio/webm', 'audio/ogg', 'audio/mp4'].find(
    t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  const recorder = new MediaRecorder(sharedMicStream, mimeType ? { mimeType } : undefined);
  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  const levels = new Uint8Array(sharedAnalyser.frequencyBinCount);

  const SILENCE_LEVEL = 8;
  // Confirmed live (Addendum 27): 1200ms was too tight even after the
  // leading-silence fix -- it also cut off ordinary MID-sentence pauses
  // ("I want to... set up a new rifle" has a natural beat after "to"),
  // truncating real speech mid-utterance, not just before it starts.
  // That's a different bug from the leading-silence one: this one fires
  // on *any* pause once speech has already begun, not just a lead-in
  // pause. Widened to give a deliberate speaker room to compose a full
  // sentence without being cut off mid-thought.
  const SILENCE_MS = 2200;
  const MIN_RECORD_MS = 500;
  const MAX_RECORD_MS = 12000;
  // Consecutive above-threshold frames (~60/sec via requestAnimationFrame)
  // required before speech is considered to have actually started -- a
  // single noisy frame shouldn't count, but real speech onset should
  // register within ~50ms.
  const SPEECH_ONSET_FRAMES = 3;
  const startedAt = Date.now();
  let silenceStartedAt = null;
  let hasSpokenYet = false;
  let aboveThresholdStreak = 0;

  return new Promise((resolve) => {
    // The stream/AudioContext are no longer torn down here -- they're
    // shared across the whole voice-enabled session (see ensureMicStream/
    // releaseMicStream above), only the per-recording MediaRecorder and
    // its chunks are single-use.
    recorder.onstop = () => {
      resolve(new Blob(chunks, { type: mimeType || 'audio/webm' }));
    };
    recorder.start();

    function tick() {
      if (recorder.state !== 'recording') return;
      sharedAnalyser.getByteFrequencyData(levels);
      const avg = levels.reduce((a, b) => a + b, 0) / levels.length;
      const elapsed = Date.now() - startedAt;
      if (avg < SILENCE_LEVEL) {
        aboveThresholdStreak = 0;
        if (silenceStartedAt === null) silenceStartedAt = Date.now();
        // Only silence *after* real speech counts as "done talking" --
        // without hasSpokenYet, a natural pause before the shooter starts
        // talking (common right after the wake-word ack: a breath, a
        // beat to think) reads as 1200ms of silence and stops the
        // recording before anything was said, sending Whisper a near-
        // empty clip that it then hallucinates plausible-sounding text
        // from (confirmed live, Addendum 14: "I want to set up a new
        // rifle" transcribed as "grateful" -- not a mishearing of real
        // speech, there wasn't enough real speech captured to mishear).
        if (hasSpokenYet && elapsed > MIN_RECORD_MS && Date.now() - silenceStartedAt > SILENCE_MS) {
          recorder.stop();
          return;
        }
      } else {
        silenceStartedAt = null;
        aboveThresholdStreak++;
        if (aboveThresholdStreak >= SPEECH_ONSET_FRAMES) hasSpokenYet = true;
      }
      if (elapsed > MAX_RECORD_MS) { recorder.stop(); return; }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function getSpeechRecognition() {
  return window.SpeechRecognition || window.webkitSpeechRecognition;
}

function startWakeListening() {
  const SR = getSpeechRecognition();
  if (!SR) {
    voiceUnsupportedEl.style.display = 'block';
    voiceEnabled = false;
    return;
  }
  wakeRecognition = new SR();
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = true;
  wakeRecognition.lang = 'en-US';

  wakeRecognition.onresult = (event) => {
    if (voiceState !== 'idle') return;
    let heard = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      heard += event.results[i][0].transcript;
    }
    if (heard.toLowerCase().includes('ballistica')) {
      try { wakeRecognition.stop(); } catch (e) {}
      handleWakeWord();
    }
  };

  wakeRecognition.onend = () => {
    if (voiceEnabled && voiceState === 'idle') {
      try { wakeRecognition.start(); } catch (e) {}
    }
  };

  wakeRecognition.onerror = (event) => {
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      voiceEnabled = false;
      voiceState = 'off';
      setVoiceState('Voice: microphone permission denied');
      enableVoiceBtn.textContent = 'Enable voice ("Ballistica")';
    }
    // Other errors (no-speech timeouts, transient network hiccups) are
    // routine for continuous recognition -- onend already restarts it.
  };

  voiceState = 'idle';
  setVoiceState('Voice: listening for "Ballistica"...');
  voiceHeardEl.textContent = '';
  wakeRecognition.start();
}

// One record -> transcribe -> query -> speak cycle. Returns true if the
// backend says we're mid-conversation (guided load/rifle setup, chrono
// calibration) and should keep listening for the next answer without
// requiring the wake word again -- false to drop back to sleep. A silent/
// failed turn also returns false rather than looping blindly forever; the
// backend session itself (e.g. an in-progress setup) is untouched by a
// frontend hiccup like this, so saying "Ballistica" again just resumes it.
async function runConversationTurn() {
  voiceState = 'listening';
  setVoiceState('Listening...', true);
  let blob;
  try {
    blob = await recordCommand();
  } catch (e) {
    setVoiceState('Voice: microphone error');
    return false;
  }

  voiceState = 'processing';
  setVoiceState('Processing...', true);
  try {
    const form = new FormData();
    form.append('audio', blob, 'command.webm');
    const transcribeRes = await fetch('/voice/transcribe', { method: 'POST', body: form });
    const transcribeData = await transcribeRes.json();
    if (!transcribeRes.ok) throw new Error(transcribeData.detail || 'transcription failed');
    const heardText = (transcribeData.text || '').trim();
    voiceHeardEl.textContent = heardText ? `Heard: "${heardText}"` : '';

    if (!heardText) {
      voiceState = 'speaking';
      await speak("Didn't catch that. Say again.");
      return false;
    }

    const queryRes = await fetch('/voice/query', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: heardText }),
    });
    const queryData = await queryRes.json();
    voiceState = 'speaking';
    setVoiceState('Speaking...', true);
    await speak(queryData.reply || "Didn't catch that.");
    return !!queryData.awaiting_response;
  } catch (e) {
    setVoiceState('Voice: error handling that command');
    return false;
  }
}

async function handleWakeWord() {
  voiceState = 'acknowledging';
  setVoiceState('Ballistica heard -- acknowledging', true);
  const ackPool = sessionWakeCount === 0 ? GREETING_PHRASES : ACK_PHRASES;
  sessionWakeCount++;
  await speak(ackPool[Math.floor(Math.random() * ackPool.length)]);

  // voiceEnabled is re-checked every iteration -- without it, disabling
  // voice mid-conversation did nothing: the sign-off phrase would play
  // (that's a separate, immediate action in the disable button's own
  // handler below) but this loop kept recording and retrying regardless,
  // since it had no way to know the toggle had changed. Confirmed live
  // (Addendum 11): a stuck setup session that couldn't be interpreted
  // kept repeating "didn't understand" even after disabling, requiring a
  // full app close to stop. MAX_TURNS is a hard backstop on top of that --
  // the backend now gives up on its own after a few consecutive failures
  // (see _MAX_FAILED_ATTEMPTS in cli.py), but a stuck loop was bad enough
  // to also want a ceiling here that doesn't depend on the backend
  // behaving.
  let keepGoing = true;
  let turns = 0;
  const MAX_TURNS = 20;
  while (keepGoing && voiceEnabled && turns < MAX_TURNS) {
    keepGoing = await runConversationTurn();
    turns++;
  }

  // The rifle/load panels were only ever loaded once, at page load --
  // a voice command (switch load, a saved setup interview, calibration)
  // can change the active rifle/load without the on-screen form ever
  // reflecting it. Root-caused live (Addendum 34): this resync used to
  // fetch /status itself and silently swallow ANY failure from it
  // (including the ordinary case of a freshly-created rifle with no
  // active load yet -- Addendum 36), which meant the GET /rifles list
  // refresh never even ran, so a rifle that really did save server-side
  // never showed up on screen. loadRifles() below now does its own
  // /status lookup internally with the same graceful fallback, and
  // always refreshes the list regardless of whether that lookup
  // succeeds -- so a genuine fetch failure here is now visible (it
  // flashes calcError) rather than silently discarded.
  try {
    await loadRifles();
  } catch (e) {}

  voiceState = 'idle';
  if (voiceEnabled) startWakeListening();
}

// Keeps the screen from locking/sleeping while voice is on -- otherwise
// the OS screensaver kicks in during a hands-free session at the range
// and the app disappears out from under an in-progress conversation.
// Held only while voice is actively enabled (not the whole time the page
// is open), so it doesn't needlessly burn battery outside active use.
// The lock is auto-released by the browser whenever the tab loses
// visibility (switching apps, screen manually turned off) even if
// voiceEnabled hasn't changed -- re-acquired on visibilitychange so
// coming back to the app doesn't leave it silently unprotected.
let wakeLock = null;

async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {
    // Permission/state errors here are routine (e.g. backgrounded tab) --
    // nothing to show the shooter, voice still works, the screen just
    // might sleep.
  }
}

function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} }
  wakeLock = null;
}

document.addEventListener('visibilitychange', () => {
  if (voiceEnabled && document.visibilityState === 'visible') acquireWakeLock();
});

enableVoiceBtn.addEventListener('click', async () => {
  if (voiceEnabled) {
    const hadSession = sessionWakeCount > 0;
    voiceEnabled = false;
    voiceState = 'off';
    if (wakeRecognition) { try { wakeRecognition.stop(); } catch (e) {} }
    releaseWakeLock();
    releaseMicStream();
    setVoiceState('Voice: off');
    voiceHeardEl.textContent = '';
    enableVoiceBtn.textContent = 'Enable voice ("Ballistica")';
    // Fire-and-forget: the toggle and mic should go quiet right away,
    // the sign-off just plays out over it rather than blocking the UI.
    if (hadSession) {
      speak(SIGNOFF_PHRASES[Math.floor(Math.random() * SIGNOFF_PHRASES.length)]);
    }
    return;
  }
  voiceEnabled = true;
  sessionWakeCount = 0;
  enableVoiceBtn.textContent = 'Disable voice';
  // Root-caused live: wake-word listening must start immediately and
  // unconditionally -- awaiting ensureMicStream() here first (the
  // original Addendum 30 fix) meant that whenever getUserMedia() was
  // slow to resolve or hung on a permission prompt, wake-word listening
  // never started at all, and voice mode looked completely dead ("hit
  // enable voice, nothing happens") with no error surfaced anywhere.
  // Fire-and-forget instead: mic acquisition happens in the background,
  // and recordCommand() calls ensureMicStream() again on first actual
  // use regardless, so a still-pending/failed acquisition here just
  // gets retried then, same safety net as before -- just no longer
  // blocking the one thing that must never be blocked.
  acquireWakeLock();
  startWakeListening();
  ensureMicStream().catch(() => {});
});

loadRifles();
</script>
