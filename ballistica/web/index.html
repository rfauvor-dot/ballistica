<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ballistica</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#c1440e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ballistica">
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #555555;
    --line: #cccccc;
    --accent: #c1440e;
    --accent-text: #ffffff;
    --field-bg: #f4f4f4;
    --error-bg: #ffe4e1;
    --error-text: #8b0000;
    --ok-bg: #eef7ee;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding: 14px 14px 40px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 4px 0 14px; text-align: center; letter-spacing: 0.5px; }
  h2 { font-size: 15px; margin: 4px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; margin-bottom: 4px; }
  .field { display: inline-flex; flex-direction: column; flex-shrink: 0; }
  .field label {
    font-weight: 700; font-size: 11px; color: var(--muted); margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.2px; line-height: 1.15;
    /* Labels read as short words (title="..." on the input carries the unit),
       but this is a defensive net: a narrow field's label wraps or breaks
       instead of ever overflowing into the next field -- nowrap here was
       exactly what caused labels to spill sideways and overlap neighbors. */
    overflow-wrap: anywhere; white-space: normal;
  }
  input, select {
    font-size: 18px; padding: 8px 8px; min-height: 42px;
    border: 2px solid var(--line); border-radius: 8px; background: var(--field-bg); color: var(--text);
  }
  select { -webkit-appearance: none; appearance: none; }
  input:focus, select:focus { outline: 3px solid var(--accent); border-color: var(--accent); }
  /* Native number-input spin arrows eat real width from already-narrow
     fields (a box sized to hold "59" doesn't have room left over for
     spin buttons too) -- typing is faster than tapping them anyway. */
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* content-sized field widths -- not uniform, sized to what each value actually holds */
  .w-xs  { width: 6ch; }   /* temp (incl. sign), humidity, wind speed, wind clock -- empirically fits "-12", "100", "999" without clipping */
  .w-sm  { width: 8ch; }   /* altitude, pressure, BC, velocity, zero, powder charge, click value, distance, bullet weight, barrel length -- fits "29.92", "0.999" */
  .w-md  { width: 10ch; }    /* twist rate, drag model */
  .w-lg  { flex: 1 1 16ch; min-width: 14ch; } /* caliber, powder, bullet type, load name, notes */
  .w-full { width: 100%; }

  .field.w-lg { flex: 1 1 16ch; }
  .field.w-full { width: 100%; flex-basis: 100%; }

  button {
    font-size: 17px; font-weight: 700; padding: 10px 16px; min-height: 46px;
    background: var(--field-bg); color: var(--text);
    border: 2px solid var(--line); border-radius: 8px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.big { width: 100%; font-size: 22px; min-height: 58px; margin-top: 4px; }
  button:active { opacity: 0.85; }

  /* Addendum 35: a native <select> with appearance:none has no visual
     affordance signaling it's tappable -- Rick never noticed it was
     there. Reusing the same details/summary pattern as the other
     panels below makes "tap to expand a list" obvious and consistent
     with the rest of the app, and doubles as a plain, always-visible
     way to confirm what's actually saved (Addendum 34's diagnostic ask). */
  .rifle-picker-details { margin-top: 0; margin-bottom: 8px; }
  .rifle-picker-details > summary { font-size: 20px; font-weight: 700; color: var(--text); padding: 12px 14px; }
  .rifle-picker-details > summary::before { content: "\25B8  "; color: var(--muted); font-size: 14px; }
  .rifle-picker-details[open] > summary::before { content: "\25BE  "; }
  .rifle-list-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    width: 100%; text-align: left; padding: 12px 10px; font-size: 17px;
    border: none; border-top: 1px solid var(--line); border-radius: 0;
    background: transparent; color: var(--text); min-height: 0;
  }
  .rifle-list-row:first-child { border-top: none; }
  .rifle-list-row.active { font-weight: 700; color: var(--accent); }
  .rifle-list-row span:last-child { font-size: 14px; color: var(--muted); font-weight: 400; }
  .rifle-list-row.active span:last-child { color: var(--accent); }
  .rifle-list-empty { padding: 8px 10px; color: var(--muted); font-size: 15px; }
  .rifle-actions { display: flex; gap: 8px; margin-bottom: 6px; }
  .rifle-actions button { flex: 1; min-height: 46px; }

  .load-header { display: flex; gap: 8px; align-items: center; margin: 14px 0 6px; }
  .load-header select { flex: 1; font-size: 18px; min-height: 46px; }

  details { margin-top: 10px; border: 2px solid var(--line); border-radius: 10px; }
  summary { padding: 10px 14px; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "\25B8  "; }
  details[open] summary::before { content: "\25BE  "; }
  .panel-body { padding: 4px 14px 14px; }

  hr.sep { border: none; border-top: 2px solid var(--line); margin: 18px 0; }

  #calcError, #rifleError, #loadError, #authError, #waiverError {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 8px;
    background: var(--error-bg); color: var(--error-text); font-weight: 600; font-size: 15px;
  }
  #rifleOk, #loadOk, #authOk {
    display: none; margin-top: 10px; padding: 8px 12px; border-radius: 8px;
    background: var(--ok-bg); color: #2a6b2a; font-weight: 600; font-size: 14px;
  }
  #authPanel { max-width: 420px; margin: 24px auto; }
  #authPanel .field { width: 100%; margin-bottom: 10px; }
  #authPanel input { width: 100%; }
  #authPanel button { width: 100%; margin-top: 6px; }
  #waiverPanel { max-width: 560px; margin: 24px auto; }
  #waiverPanel button { width: 100%; margin-top: 6px; }
  #waiverPanel #waiverAcceptBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #waiverScroll h3 { font-size: 15px; margin: 14px 0 4px; }
  #waiverScroll h3:first-child { margin-top: 0; }
  #waiverScroll p { margin: 6px 0; }
  #waiverScroll ul { margin: 6px 0; padding-left: 22px; }
  #waiverScroll li { margin: 4px 0; }

  #result { display: none; margin-top: 20px; }
  .result-card { border: 2px solid var(--text); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .result-card .label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .result-card .big { font-size: 46px; font-weight: 800; line-height: 1.1; margin: 2px 0; }
  .result-card .sub { font-size: 17px; color: var(--muted); }
  .meta { text-align: center; color: var(--muted); font-size: 15px; margin-top: 8px; }

  #status { text-align: center; color: var(--muted); font-size: 14px; margin-top: 4px; min-height: 18px; }

  .voice-panel {
    border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px;
    margin-bottom: 16px; text-align: center;
  }
  .voice-panel .state-line { font-size: 15px; font-weight: 700; color: var(--muted); min-height: 20px; }
  .voice-panel .state-line.hot { color: var(--accent); }
  .voice-panel .heard-line { font-size: 14px; color: var(--muted); font-style: italic; min-height: 18px; margin-top: 2px; }
  #enableVoiceBtn { margin-top: 8px; }
  #voiceUnsupported { display: none; color: var(--error-text); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>BALLISTICA</h1>

  <div id="authPanel" style="display:none">
    <div class="field w-full">
      <label for="authEmail">Email</label>
      <input id="authEmail" type="email" autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="field w-full">
      <label for="authPassword">Password</label>
      <input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters">
    </div>
    <button id="signUpBtn" class="primary big">Create account</button>
    <button id="signInBtn" class="primary big" style="display:none">Sign in</button>
    <div id="authOk"></div>
    <div id="authError"></div>
    <div id="authModeToggle" style="text-align:center; margin-top:10px; font-size:14px;">
      <a href="#" id="authModeToggleLink" style="color:var(--muted); text-decoration:underline;">Already have an account? Sign in</a>
    </div>
  </div>

  <div id="waiverPanel" style="display:none">
    <h2 id="waiverTitle" style="font-size:18px; margin-bottom:4px;"></h2>
    <div id="waiverScroll" style="max-height:50vh; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:14px; margin:10px 0; font-size:14px; line-height:1.5;"></div>
    <label id="waiverCheckLabel" style="display:flex; gap:10px; align-items:flex-start; margin:14px 0; font-size:14px; line-height:1.4; cursor:pointer;">
      <input type="checkbox" id="waiverCheckbox" style="margin-top:3px; flex-shrink:0;">
      <span id="waiverAckText"></span>
    </label>
    <button id="waiverAcceptBtn" class="primary big" disabled>Create my account</button>
    <button id="waiverBackBtn" class="big">Back</button>
    <div id="waiverError"></div>
  </div>

  <div id="appContent" style="display:none">
  <div class="rifle-actions" style="margin-bottom:14px">
    <span id="authEmailLabel" style="flex:1; align-self:center; color:var(--muted); font-size:14px;"></span>
    <button id="signOutBtn">Sign out</button>
  </div>

  <details id="walkthroughMenu" style="margin-bottom:14px">
    <summary>Help / Walkthrough</summary>
    <div class="panel-body" id="walkthroughList"></div>
  </details>

  <div class="voice-panel">
    <div class="state-line" id="voiceState">Voice: off</div>
    <div class="heard-line" id="voiceHeard"></div>
    <button id="enableVoiceBtn" class="primary">Enable voice ("Ballistica")</button>
    <div id="voiceUnsupported">This browser doesn't support wake-word listening (needs Chrome). Use the manual controls below instead.</div>
  </div>

  <details id="riflePicker" class="rifle-picker-details">
    <summary><span id="riflePickerLabel">Loading rifles...</span></summary>
    <div class="panel-body" id="riflePickerList"></div>
  </details>
  <div class="rifle-actions">
    <button id="newRifleBtn" title="New rifle">+ New</button>
    <button id="editRifleBtn" title="Edit this rifle">Edit</button>
  </div>

  <details id="rifleDetails">
    <summary>Rifle setup</summary>
    <div class="panel-body">
      <div class="field w-full">
        <label for="rName">Gun name</label>
        <input id="rName" type="text" placeholder="e.g. AR-15 20in Faxon">
      </div>
      <div class="row">
        <div class="field w-md"><label for="rCaliber">Caliber</label><input id="rCaliber" type="text" placeholder="e.g. .223 Wylde"></div>
        <div class="field w-sm"><label for="rBarrel">Barrel</label><input id="rBarrel" type="number" step="0.1" title="Barrel length, inches"></div>
        <div class="field w-md"><label for="rTwist">Twist rate</label><input id="rTwist" type="text" placeholder="e.g. 1:7"></div>
        <div class="field w-sm"><label for="rScope">Scope ht</label><input id="rScope" type="number" step="0.1" title="Scope height over bore, inches"></div>
        <div class="field w-md">
          <label for="rReticle">Reticle unit</label>
          <select id="rReticle"><option value="MRAD">MRAD</option><option value="MOA">MOA</option></select>
        </div>
        <div class="field w-sm"><label for="rClick">Click</label><input id="rClick" type="number" step="0.01" value="0.1" title="Click value, in the reticle unit above"></div>
        <div class="field w-md">
          <label for="rOpticType">Optic type</label>
          <select id="rOpticType"><option value="">Unknown</option><option value="scope">Scope</option><option value="red_dot">Red dot</option></select>

      </div>
      <div class="row">
        <div class="field w-lg"><label for="rScopeMake">Make</label><input id="rScopeMake" type="text" placeholder="e.g. Vortex, Holosun"></div>
        <div class="field w-lg"><label for="rScopeModel">Model</label><input id="rScopeModel" type="text" placeholder="e.g. Viper PST Gen II 5-25x50, 510C"></div>

          <select id="rSuppressor"><option value="no">No</option><option value="yes">Yes</option></select>
        </div>
        <div class="field w-lg" id="rSuppressorTypeField" style="display:none">
          <label for="rSuppressorType">Type / brand</label>
          <input id="rSuppressorType" type="text" placeholder="e.g. Dead Air Sandman-S, or 'custom build'">

        <div class="field w-sm"><label for="lBC">BC</label><input id="lBC" type="number" step="0.001" placeholder="e.g. 0.362"></div>

      </div>
      <div class="row">
        <div class="field w-lg"><label for="lNotes">Notes</label><input id="lNotes" type="text"></div>
      </div>
      <button id="saveLoadBtn" class="primary">Save load</button>
      <div id="loadOk"></div>
      <div id="loadError"></div>
    </div>
  </details>

  <hr class="sep">

  <div class="row">
    <div class="field w-sm"><label for="rangeInput">Distance</label><input id="rangeInput" type="number" inputmode="decimal" min="0" step="1" placeholder="400" title="Target distance, yards"></div>
    <button id="solveBtn" class="primary">GET SOLUTION</button>
  </div>
  <div id="status"></div>
  <div id="calcError"></div>

  <details id="condDetails">
    <summary>Conditions (optional)</summary>
    <div class="panel-body">
      <div class="row">
        <div class="field w-xs"><label>Temp</label><input id="tempF" type="number" value="59" title="Temperature, degrees F"></div>
        <div class="field w-xs"><label>Humid</label><input id="humidPct" type="number" value="0" title="Relative humidity, %"></div>
        <div class="field w-xs"><label>Wind</label><input id="windMph" type="number" value="0" title="Wind speed, mph"></div>
      </div>
      <div class="row">
        <div class="field w-sm"><label>Alt</label><input id="altFt" type="number" value="0" title="Altitude, feet"></div>
        <div class="field w-sm"><label>Press</label><input id="pressInHg" type="number" step="0.01" placeholder="auto" title="Barometric pressure, inHg -- leave blank to estimate from altitude"></div>
        <div class="field w-xs"><label>Clock</label><input id="windClock" type="number" min="0" max="12" step="0.5" value="12" title="Wind direction: 12 = headwind, 3 = from the right, 9 = from the left"></div>
      </div>
    </div>
  </details>

  <div id="result">
    <div class="result-card">
      <div class="label">Drop (dial/hold up)</div>
      <div class="big" id="dropIn">--</div>
      <div class="sub" id="dropSub">--</div>
    </div>
    <div class="result-card">
      <div class="label">Windage</div>
      <div class="big" id="windIn">--</div>
      <div class="sub" id="windSub">--</div>
    </div>
    <div class="meta" id="velMeta"></div>
  </div>

<script>
// ---------------------------------------------------------------- auth
// Cutover to the multi-tenant foundation: every data-touching endpoint
// now requires a signed-in Supabase user (see MULTI_TENANCY_DESIGN.md).
// The old single-tenant endpoints (/rifles, /voice/query, etc.) are
// deliberately left running server-side, untouched -- this only changes
// which path the web UI itself calls, not what the backend offers.
const SUPABASE_URL = "__SUPABASE_URL__";
const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY__";
const SESSION_KEY = 'ballistica_session';

function getSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function setSession(session) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

async function supabaseAuthCall(path, body) {
  let res;
  try {
    res = await fetch(`${SUPABASE_URL}/auth/v1${path}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch (e) {
    throw new Error('Network error -- check the connection and try again.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error_description || data.msg || data.error || `Request failed (${res.status})`);
  }
  return data;
}

function sessionFromAuthResponse(data, fallbackEmail) {
  return {
    access_token: data.access_token, refresh_token: data.refresh_token,
    expires_at: data.expires_at, email: (data.user && data.user.email) || fallbackEmail,
  };
}

// Belt-and-suspenders capture of waiver acceptance (see api.py's
// /v2/waiver/accept docstring for the full reasoning): `data` on a
// Supabase signup call lands in auth.users.raw_user_meta_data
// immediately, regardless of whether email confirmation is required --
// unlike the structured waiver_acceptances table (db/004), which needs
// an authenticated session that doesn't exist yet for a confirmation-
// required signup. This is the capture that never depends on the user
// coming back; PENDING_WAIVER_KEY below (staged in localStorage, mirrored
// into the real table on first authenticated session) is the other half.
async function signUp(email, password, waiverInfo) {
  const data = await supabaseAuthCall('/signup', {
    email, password,
    data: {
      waiver_accepted: true, waiver_version: waiverInfo.waiver_version,
      waiver_sha256: waiverInfo.waiver_sha256, waiver_accepted_at: waiverInfo.accepted_at,
    },
  });
  if (!data.access_token) {
    // No session yet (email confirmation required) -- stage the
    // acceptance so it still lands in the structured, queryable table
    // once this account actually gets a session, whenever that is.
    try { localStorage.setItem(PENDING_WAIVER_KEY, JSON.stringify(waiverInfo)); } catch (e) {}
    return { needsConfirmation: true };
  }
  setSession(sessionFromAuthResponse(data, email));
  await recordWaiverAcceptance(waiverInfo, data.access_token);
  return { needsConfirmation: false };
}

async function signIn(email, password) {
  const data = await supabaseAuthCall('/token?grant_type=password', { email, password });
  setSession(sessionFromAuthResponse(data, email));
}

const PENDING_WAIVER_KEY = 'ballistica_pending_waiver_acceptance';

// Writes the append-only, structured acceptance row (db/004) -- called
// right after signup if a session came back immediately, or on the
// first sign-in after a confirmation-required signup, whichever comes
// first. Failure here isn't treated as fatal to signing the user in --
// the raw_user_meta_data capture from signUp() above already covers
// the "proof this was accepted" requirement even if this mirror write
// never lands (e.g. a transient network error) -- but it does mean a
// real failure here isn't silently pretended-successful either.
async function recordWaiverAcceptance(waiverInfo, accessToken) {
  try {
    const res = await fetch('/v2/waiver/accept', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
      body: JSON.stringify(waiverInfo),
    });
    if (res.ok) {
      try { localStorage.removeItem(PENDING_WAIVER_KEY); } catch (e) {}
    }
  } catch (e) {
    // Network error -- leave PENDING_WAIVER_KEY in place, retried next
    // time recordPendingWaiverAcceptanceIfAny() runs (next sign-in/load).
  }
}

// Called once a valid session exists (requireAuth() below) -- mirrors a
// staged confirmation-required signup's waiver acceptance into the real
// table now that there's finally a token to authenticate the write with.
async function recordPendingWaiverAcceptanceIfAny(accessToken) {
  let pending;
  try {
    const raw = localStorage.getItem(PENDING_WAIVER_KEY);
    if (!raw) return;
    pending = JSON.parse(raw);
  } catch (e) { return; }
  await recordWaiverAcceptance(pending, accessToken);
}

async function refreshSession(session) {
  const data = await supabaseAuthCall('/token?grant_type=refresh_token', { refresh_token: session.refresh_token });
  const updated = sessionFromAuthResponse(data, session.email);
  setSession(updated);
  return updated;
}

// A voice session at the range can run long -- Supabase access tokens
// last about an hour, and letting one silently go stale mid-session
// would look exactly like the app just stopped responding, the same
// class of confusing failure earlier addenda in this project were
// about. Refreshed proactively (a minute of headroom) rather than
// waiting for a request to actually fail on an expired token first.
async function getValidAccessToken() {
  let session = getSession();
  if (!session) return null;
  const expiresInMs = (session.expires_at * 1000) - Date.now();
  if (expiresInMs < 60000) {
    try {
      session = await refreshSession(session);
    } catch (e) {
      clearSession();
      return null;
    }
  }
  return session.access_token;
}

// Called once at page load, and after a sign-in/sign-up succeeds.
// Returns whether the app content is actually showing (a signed-in,
// currently-valid session) -- callers that need auth before doing
// anything else (loadRifles, voice enable) check this first.
async function requireAuth() {
  const token = await getValidAccessToken();
  if (!token) {
    showAuthPanel();
    return false;
  }
  await recordPendingWaiverAcceptanceIfAny(token);
  showAppContent();
  return true;
}

}

async function api(path, options) {
  const token = await getValidAccessToken();
  if (!token) {
    showAuthPanel();
    throw new Error('Signed out -- please sign in again.');
  }
  const opts = Object.assign({}, options);
  opts.headers = Object.assign({}, opts.headers, { Authorization: `Bearer ${token}` });
  let res;
  try {
    res = await fetch(`/v2${path}`, opts);
  } catch (e) {
    throw new Error('Network error -- check the connection and try again.');
  }
  let body;
  try { body = await res.json(); } catch (e) { body = null; }
  if (!res.ok) {
    if (res.status === 401) {
      clearSession();
      showAuthPanel();
    }
    const detail = body && body.detail ? body.detail : `HTTP ${res.status}`;
    throw new Error(detail);
  }
  return body;
}

async function loadRifles(selectName) {
  setStatus('Loading rifles...');
  try {
    allRifles = await api('/rifles');
    if (!allRifles.length) {
      currentRifleDetail = null;
      renderRiflePicker();
      openRifleFormBlank();
      setStatus('');
      return;
    }
    if (!selectName) {
      // No explicit hint -- ask which rifle is actually active rather
      // than defaulting to "first in the list" (Addendum 34: that
      // default could silently skip right past a rifle that was just
      // created and made active). /status 404s when the active rifle
      // has no active load yet -- normal for a rifle just created by
      // voice before any load exists (Addendum 36) -- so this falls
      // through to the existing-detail/first-item fallback below rather
      // than failing the whole refresh.
      try {
        selectName = (await api('/status')).rifle.name;
      } catch (e) { /* fall through */ }
    }
    const stillExists = (name) => name && allRifles.some(r => r.name === name);
    const name = stillExists(selectName) ? selectName
      : stillExists(currentRifleDetail && currentRifleDetail.name) ? currentRifleDetail.name
      : allRifles[0].name;
    await loadRifleDetail(name);
  } catch (e) {
    flash(calcError, 'Could not reach Ballistica: ' + e.message);
  }
  setStatus('');
}

// ---------------------------------------------------------------- voice
// Two speech engines, deliberately: the browser's free, built-in
// SpeechRecognition runs continuously watching only for the wake word
// ("Ballistica") -- that's what makes always-on listening not cost
// money or ship a stream of background range-talk to a cloud API.
// Once the wake word fires, that recognizer stops and the actual
// command gets recorded properly and sent to OpenAI's Whisper via
// /voice/transcribe for better accuracy on numbers and ballistics
// terms, then /voice/query for the answer, then /voice/speak for the
// reply. One tap is unavoidable to arm this the first time (browsers
// require a user gesture before granting microphone access) -- after
// that it's hands-free until you tap again to disable it.

// In-session wakes stay terse/tactical -- these fire mid-string, between
// shots, where a shooter wants an ack and nothing else. Session start/stop
// get warmer phrasing instead (see GREETING_PHRASES/SIGNOFF_PHRASES below):
// that's the one moment that isn't live fire, so it can afford a sentence.
const ACK_PHRASES = [
  "Copy that, standing by.",
  "Ballistica up, go ahead.",
  "I'm here, Rick. Go ahead.",
];

const GREETING_PHRASES = [
  "Hey Rick, Ballistica's up. What are we working with today?",
  "Good to go, Rick -- what do you need?",
  "Ballistica's online. Let's get you dialed in.",
];

const SIGNOFF_PHRASES = [
  "Alright, standing down. Good shooting.",
  "Voice off -- catch you next session.",
  "That's a wrap. I'm here when you need me.",
];

let voiceEnabled = false;
let voiceState = 'off'; // off | idle | acknowledging | listening | processing | speaking
let wakeRecognition = null;
let sessionWakeCount = 0;

const voiceStateEl = document.getElementById('voiceState');
const voiceHeardEl = document.getElementById('voiceHeard');
const enableVoiceBtn = document.getElementById('enableVoiceBtn');
const voiceUnsupportedEl = document.getElementById('voiceUnsupported');

function setVoiceState(text, hot) {
  voiceStateEl.textContent = text;
  voiceStateEl.classList.toggle('hot', !!hot);
}

// Addendum 30: a single Audio element reused across every reply, instead
// of a fresh one per playback -- pairs with the persistent mic stream
// below, since repeatedly tearing down and recreating audio objects is
// the same class of thing suspected of causing the reported click/pop
// (an audio route re-negotiation) on Bluetooth earbuds.
let sharedAudioEl = null;

// Root-caused live: mobile browsers (notably iOS Safari) block .play()
// calls that don't originate from a direct, synchronous user gesture --
// and the wake-word ack/reply fires from an async SpeechRecognition
// callback, not a tap, so playback was getting silently blocked. The
// old code (`sharedAudioEl.play().catch(resolve)`) treated that
// rejection exactly the same as a normal "finished playing" event, so
// the app believed every reply played fine while nothing was ever
// audible -- wake-word listening worked (mic permission was fine,
// "listening for Ballistica" showed correctly), but zero response was
// ever heard, with no error surfaced anywhere. Playing (even a silent
// clip) inside the real tap that enables voice unlocks the element for
// every later programmatic play() call this session on browsers that
// require that pattern.
function unlockAudioPlayback() {
  if (!sharedAudioEl) sharedAudioEl = new Audio();
  sharedAudioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  sharedAudioEl.play().catch(() => {});
}

async function playAudioBlob(blob) {
  const url = URL.createObjectURL(blob);
  if (!sharedAudioEl) sharedAudioEl = new Audio();
  sharedAudioEl.src = url;
  await new Promise((resolve) => {
    sharedAudioEl.onended = resolve;
    sharedAudioEl.onerror = resolve;
    sharedAudioEl.play().catch((e) => {
      // No longer silently swallowed -- a real failure here should be
      // visible for future debugging, even though unlockAudioPlayback()
      // above is what should prevent it from happening at all now.
      console.error('TTS playback blocked or failed:', e);
      resolve();
    });
  });
  URL.revokeObjectURL(url);
}

async function speak(text) {
  try {
    const res = await fetch('/voice/speak', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) return;
    await playAudioBlob(await res.blob());
  } catch (e) {
    // Voice output failing shouldn't break the loop -- the state line
    // still shows what was going on, silently.
  }
}

// Addendum 30 (root-caused from code, pending Rick's live confirmation):
// recordCommand() used to call getUserMedia() and tear the stream/
// AudioContext back down on EVERY voice turn, not once per session --
// during a multi-distance test that's a full mic acquire/release cycle
// per query, since a plain drop-at-range answer doesn't set
// awaiting_response and so exits handleWakeWord()'s loop after one
// turn. Repeatedly opening and closing mic access is a well-documented
// trigger for Bluetooth earbuds to audibly click as they renegotiate
// between the A2DP (media playback) and HFP (mic) profiles. Held open
// for the whole voice-enabled session instead -- acquired once in the
// enable-voice handler, released once in the disable handler -- so
// that renegotiation happens at most once per session rather than once
// per query.
let sharedMicStream = null;
let sharedAudioCtx = null;
let sharedAnalyser = null;

async function ensureMicStream() {
  if (sharedMicStream) return;
  sharedMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  sharedAudioCtx = new AudioCtx();
  sharedAnalyser = sharedAudioCtx.createAnalyser();
  sharedAnalyser.fftSize = 512;
  sharedAudioCtx.createMediaStreamSource(sharedMicStream).connect(sharedAnalyser);
}

function releaseMicStream() {
  if (sharedMicStream) sharedMicStream.getTracks().forEach(t => t.stop());
  sharedMicStream = null;
  if (sharedAudioCtx) { try { sharedAudioCtx.close(); } catch (e) {} }
  sharedAudioCtx = null;
  sharedAnalyser = null;
}

async function recordCommand() {
  await ensureMicStream();
  const mimeType = ['audio/webm', 'audio/ogg', 'audio/mp4'].find(
    t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  const recorder = new MediaRecorder(sharedMicStream, mimeType ? { mimeType } : undefined);
  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  const levels = new Uint8Array(sharedAnalyser.frequencyBinCount);

  const SILENCE_LEVEL = 8;
  // Confirmed live (Addendum 27): 1200ms was too tight even after the
  // leading-silence fix -- it also cut off ordinary MID-sentence pauses
  // ("I want to... set up a new rifle" has a natural beat after "to"),
  // truncating real speech mid-utterance, not just before it starts.
  // That's a different bug from the leading-silence one: this one fires
  // on *any* pause once speech has already begun, not just a lead-in
  // pause. Widened to give a deliberate speaker room to compose a full
  // sentence without being cut off mid-thought.
  const SILENCE_MS = 2200;
  const MIN_RECORD_MS = 500;
  const MAX_RECORD_MS = 12000;
  // Consecutive above-threshold frames (~60/sec via requestAnimationFrame)
  // required before speech is considered to have actually started -- a
  // single noisy frame shouldn't count, but real speech onset should
  // register within ~50ms.
  const SPEECH_ONSET_FRAMES = 3;
  const startedAt = Date.now();
  let silenceStartedAt = null;
  let hasSpokenYet = false;
  let aboveThresholdStreak = 0;

  return new Promise((resolve) => {
    // The stream/AudioContext are no longer torn down here -- they're
    // shared across the whole voice-enabled session (see ensureMicStream/
    // releaseMicStream above), only the per-recording MediaRecorder and
    // its chunks are single-use.
    recorder.onstop = () => {
      resolve(new Blob(chunks, { type: mimeType || 'audio/webm' }));
    };
    recorder.start();

    function tick() {
      if (recorder.state !== 'recording') return;
      sharedAnalyser.getByteFrequencyData(levels);
      const avg = levels.reduce((a, b) => a + b, 0) / levels.length;
      const elapsed = Date.now() - startedAt;
      if (avg < SILENCE_LEVEL) {
        aboveThresholdStreak = 0;
        if (silenceStartedAt === null) silenceStartedAt = Date.now();
        // Only silence *after* real speech counts as "done talking" --
        // without hasSpokenYet, a natural pause before the shooter starts
        // talking (common right after the wake-word ack: a breath, a
        // beat to think) reads as 1200ms of silence and stops the
        // recording before anything was said, sending Whisper a near-
        // empty clip that it then hallucinates plausible-sounding text
        // from (confirmed live, Addendum 14: "I want to set up a new
        // rifle" transcribed as "grateful" -- not a mishearing of real
        // speech, there wasn't enough real speech captured to mishear).
        if (hasSpokenYet && elapsed > MIN_RECORD_MS && Date.now() - silenceStartedAt > SILENCE_MS) {
          recorder.stop();
          return;
        }
      } else {
        silenceStartedAt = null;
        aboveThresholdStreak++;
        if (aboveThresholdStreak >= SPEECH_ONSET_FRAMES) hasSpokenYet = true;
      }
      if (elapsed > MAX_RECORD_MS) { recorder.stop(); return; }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function getSpeechRecognition() {
  return window.SpeechRecognition || window.webkitSpeechRecognition;
}

function startWakeListening() {
  const SR = getSpeechRecognition();
  if (!SR) {
    voiceUnsupportedEl.style.display = 'block';
    voiceEnabled = false;
    return;
  }
  wakeRecognition = new SR();
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = true;
  wakeRecognition.lang = 'en-US';

  wakeRecognition.onresult = (event) => {
    if (voiceState !== 'idle') return;
    let heard = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      heard += event.results[i][0].transcript;
    }
    if (heard.toLowerCase().includes('ballistica')) {
      try { wakeRecognition.stop(); } catch (e) {}
      handleWakeWord();
    }
  };

  wakeRecognition.onend = () => {
    if (voiceEnabled && voiceState === 'idle') {
      try { wakeRecognition.start(); } catch (e) {}
    }
  };

  wakeRecognition.onerror = (event) => {
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      voiceEnabled = false;
      voiceState = 'off';
      setVoiceState('Voice: microphone permission denied');
      enableVoiceBtn.textContent = 'Enable voice ("Ballistica")';
    }
    // Other errors (no-speech timeouts, transient network hiccups) are
    // routine for continuous recognition -- onend already restarts it.
  };

  voiceState = 'idle';
  setVoiceState('Voice: listening for "Ballistica"...');
  voiceHeardEl.textContent = '';
  wakeRecognition.start();
}

// One record -> transcribe -> query -> speak cycle. Returns true if the
// backend says we're mid-conversation (guided load/rifle setup, chrono
// calibration) and should keep listening for the next answer without
// requiring the wake word again -- false to drop back to sleep. A silent/
// failed turn also returns false rather than looping blindly forever; the
// backend session itself (e.g. an in-progress setup) is untouched by a
// frontend hiccup like this, so saying "Ballistica" again just resumes it.
async function runConversationTurn() {
  voiceState = 'listening';
  setVoiceState('Listening...', true);
  let blob;
  try {
    blob = await recordCommand();
  } catch (e) {
    setVoiceState('Voice: microphone error');
    return false;
  }

  voiceState = 'processing';
  setVoiceState('Processing...', true);
  try {
    const form = new FormData();
    form.append('audio', blob, 'command.webm');
    const transcribeRes = await fetch('/voice/transcribe', { method: 'POST', body: form });
    const transcribeData = await transcribeRes.json();
    if (!transcribeRes.ok) throw new Error(transcribeData.detail || 'transcription failed');
    const heardText = (transcribeData.text || '').trim();
    voiceHeardEl.textContent = heardText ? `Heard: "${heardText}"` : '';

    if (!heardText) {
      voiceState = 'speaking';
      await speak("Didn't catch that. Say again.");
      return false;
    }

    const token = await getValidAccessToken();
    if (!token) {
      showAuthPanel();
      setVoiceState('Voice: signed out');
      return false;
    }
    const queryRes = await fetch('/v2/voice/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ text: heardText }),
    });
    const queryData = await queryRes.json();
    voiceState = 'speaking';
    setVoiceState('Speaking...', true);
    await speak(queryData.reply || "Didn't catch that.");
    return !!queryData.awaiting_response;
  } catch (e) {
    setVoiceState('Voice: error handling that command');
    return false;
  }
}

async function handleWakeWord() {
  voiceState = 'acknowledging';
  setVoiceState('Ballistica heard -- acknowledging', true);
  const ackPool = sessionWakeCount === 0 ? GREETING_PHRASES : ACK_PHRASES;
  sessionWakeCount++;
  await speak(ackPool[Math.floor(Math.random() * ackPool.length)]);

  // voiceEnabled is re-checked every iteration -- without it, disabling
  // voice mid-conversation did nothing: the sign-off phrase would play
  // (that's a separate, immediate action in the disable button's own
  // handler below) but this loop kept recording and retrying regardless,
  // since it had no way to know the toggle had changed. Confirmed live
  // (Addendum 11): a stuck setup session that couldn't be interpreted
  // kept repeating "didn't understand" even after disabling, requiring a
  // full app close to stop. MAX_TURNS is a hard backstop on top of that --
  // the backend now gives up on its own after a few consecutive failures
  // (see _MAX_FAILED_ATTEMPTS in cli.py), but a stuck loop was bad enough
  // to also want a ceiling here that doesn't depend on the backend
  // behaving.
  let keepGoing = true;
  let turns = 0;
  const MAX_TURNS = 20;
  while (keepGoing && voiceEnabled && turns < MAX_TURNS) {
    keepGoing = await runConversationTurn();
    turns++;
  }

  // The rifle/load panels were only ever loaded once, at page load --
  // a voice command (switch load, a saved setup interview, calibration)
  // can change the active rifle/load without the on-screen form ever
  // reflecting it. Root-caused live (Addendum 34): this resync used to
  // fetch /status itself and silently swallow ANY failure from it
  // (including the ordinary case of a freshly-created rifle with no
  // active load yet -- Addendum 36), which meant the GET /rifles list
  // refresh never even ran, so a rifle that really did save server-side
  // never showed up on screen. loadRifles() below now does its own
  // /status lookup internally with the same graceful fallback, and
  // always refreshes the list regardless of whether that lookup
  // succeeds -- so a genuine fetch failure here is now visible (it
  // flashes calcError) rather than silently discarded.
  try {
    await loadRifles();
  } catch (e) {}

  // Release the raw mic stream now that this conversation (single- or
  // multi-turn) is over, so SpeechRecognition goes back to being the
  // only thing holding the microphone during idle wake-word listening --
  // see the enable-button handler above for why this matters.
  releaseMicStream();
  voiceState = 'idle';
  if (voiceEnabled) startWakeListening();
}

// Keeps the screen from locking/sleeping while voice is on -- otherwise
// the OS screensaver kicks in during a hands-free session at the range
// and the app disappears out from under an in-progress conversation.
// Held only while voice is actively enabled (not the whole time the page
// is open), so it doesn't needlessly burn battery outside active use.
// The lock is auto-released by the browser whenever the tab loses
// visibility (switching apps, screen manually turned off) even if
// voiceEnabled hasn't changed -- re-acquired on visibilitychange so
// coming back to the app doesn't leave it silently unprotected.
let wakeLock = null;

async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {
    // Permission/state errors here are routine (e.g. backgrounded tab) --
    // nothing to show the shooter, voice still works, the screen just
    // might sleep.
  }
}

function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} }
  wakeLock = null;
}

document.addEventListener('visibilitychange', () => {
  if (voiceEnabled && document.visibilityState === 'visible') acquireWakeLock();
});

enableVoiceBtn.addEventListener('click', async () => {
  if (voiceEnabled) {
    const hadSession = sessionWakeCount > 0;
    voiceEnabled = false;
    voiceState = 'off';
    if (wakeRecognition) { try { wakeRecognition.stop(); } catch (e) {} }
    releaseWakeLock();
    releaseMicStream();
    setVoiceState('Voice: off');
    voiceHeardEl.textContent = '';
    enableVoiceBtn.textContent = 'Enable voice ("Ballistica")';
    // Fire-and-forget: the toggle and mic should go quiet right away,
    // the sign-off just plays out over it rather than blocking the UI.
    if (hadSession) {
      speak(SIGNOFF_PHRASES[Math.floor(Math.random() * SIGNOFF_PHRASES.length)]);
    }
    return;
  }
  voiceEnabled = true;
  sessionWakeCount = 0;
  enableVoiceBtn.textContent = 'Disable voice';
  // Root-caused live (three rounds on this exact code path -- see the
  // git history for the two earlier fixes this one supersedes):
  // acquiring the raw mic stream (getUserMedia) here, at enable time,
  // meant it stayed open for the ENTIRE session, including all the idle
  // time just sitting listening for the wake word -- running
  // concurrently with SpeechRecognition's own separate, independent mic
  // access the whole time. Two APIs both holding the microphone at once
  // is exactly what caused the confirmed live symptom: the mic icon
  // cycling between active/idle repeatedly with an audible click each
  // switch, constantly, even before the wake word was ever spoken. The
  // raw stream is no longer touched here at all -- it's acquired lazily
  // by recordCommand() (see handleWakeWord()) only once the wake word
  // actually fires, and released again once that conversation ends, so
  // SpeechRecognition has sole, uncontested access to the mic for the
  // entire idle-listening period, which is nearly all of a session.
  unlockAudioPlayback();
  acquireWakeLock();
  startWakeListening();
});

const authEmailInput = document.getElementById('authEmail');
const authPasswordInput = document.getElementById('authPassword');
const authOkEl = document.getElementById('authOk');
const authErrorEl = document.getElementById('authError');
const signInBtn = document.getElementById('signInBtn');
const signUpBtn = document.getElementById('signUpBtn');
const signOutBtn = document.getElementById('signOutBtn');
const authModeToggleLink = document.getElementById('authModeToggleLink');

// Two competing full-width buttons (Sign in styled primary, Create
// account styled secondary) read as an ambiguous choice, especially
// confusing for the far more common first-time case -- confirmed
// confusing live (Rick, 2026-08-28). Create account is now the one
// obvious primary action; sign-in is still fully available (removing
// it outright would strand anyone who clears storage or switches
// devices), just behind a small, clearly secondary toggle link rather
// than a second competing button.
let authMode = 'signup';
function setAuthMode(mode) {
  authMode = mode;
  hide(authOkEl); hide(authErrorEl);
  if (mode === 'signin') {
    signUpBtn.style.display = 'none';
    signInBtn.style.display = '';
    authModeToggleLink.textContent = 'New here? Create an account instead';
  } else {
    signInBtn.style.display = 'none';
    signUpBtn.style.display = '';
    authModeToggleLink.textContent = 'Already have an account? Sign in';
  }
}
authModeToggleLink.addEventListener('click', (e) => {
  e.preventDefault();
  setAuthMode(authMode === 'signup' ? 'signin' : 'signup');
});

signInBtn.addEventListener('click', async () => {
  hide(authOkEl); hide(authErrorEl);
  const email = authEmailInput.value.trim();
  const password = authPasswordInput.value;
  if (!email || !password) { flash(authErrorEl, 'Enter both email and password.'); return; }
  signInBtn.disabled = true;
  try {
    await signIn(email, password);
    await init();
  } catch (e) {
    flash(authErrorEl, e.message);
  } finally {
    signInBtn.disabled = false;
  }
});

// -------------------------------------------------------------- waiver
// Standalone acceptance step, deliberately not folded into the auth
// form itself: "Create account" validates the email/password fields
// and switches to this screen, but the actual signUp() call (and the
// account it creates) doesn't happen until the box here is checked and
// this screen's own "Create my account" button is clicked. Kept
// entirely separate from any general Terms of Service flow -- this app
// has none today, and even if it did later, this screen/step wouldn't
// be merged into it, per the waiver's own Section 10 requirement.
let pendingSignupEmail = null;
let pendingSignupPassword = null;
let currentWaiver = null; // {version, sha256} of whatever's currently rendered

const waiverEl = {
  panel: document.getElementById('waiverPanel'),
  title: document.getElementById('waiverTitle'),
  scroll: document.getElementById('waiverScroll'),
  ackText: document.getElementById('waiverAckText'),
  checkbox: document.getElementById('waiverCheckbox'),
  acceptBtn: document.getElementById('waiverAcceptBtn'),
  backBtn: document.getElementById('waiverBackBtn'),
  error: document.getElementById('waiverError'),
};

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function showWaiverPanel() {
  hide(authOkEl); hide(authErrorEl); hide(waiverEl.error);
  waiverEl.checkbox.checked = false;
  waiverEl.acceptBtn.disabled = true;
  document.getElementById('authPanel').style.display = 'none';
  waiverEl.panel.style.display = 'block';
  waiverEl.title.textContent = 'Loading...';
  waiverEl.scroll.innerHTML = '';
  waiverEl.ackText.textContent = '';
  try {
    const res = await fetch('/waiver');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const w = await res.json();
    currentWaiver = { waiver_version: w.version, waiver_sha256: w.sha256 };
    waiverEl.title.textContent = w.title;
    waiverEl.scroll.innerHTML = w.sections.map((s) => {
      let html = `<h3>${escapeHtml(s.heading)}</h3>`;
      html += s.paragraphs.map((p) => `<p>${escapeHtml(p)}</p>`).join('');
      if (s.bullets.length) {
        html += `<ul>${s.bullets.map((b) => `<li>${escapeHtml(b)}</li>`).join('')}</ul>`;
      }
      return html;
    }).join('');
    waiverEl.ackText.textContent = w.acknowledgment_text;
  } catch (e) {
    flash(waiverEl.error, 'Could not load the waiver text -- ' + e.message);
  }
}

waiverEl.checkbox.addEventListener('change', () => {
  waiverEl.acceptBtn.disabled = !waiverEl.checkbox.checked;
});

waiverEl.backBtn.addEventListener('click', () => {
  waiverEl.panel.style.display = 'none';
  document.getElementById('authPanel').style.display = 'block';
});

waiverEl.acceptBtn.addEventListener('click', async () => {
  if (!waiverEl.checkbox.checked || !currentWaiver) return;
  hide(waiverEl.error);
  waiverEl.acceptBtn.disabled = true;
  try {
    const waiverInfo = { ...currentWaiver, accepted_at: new Date().toISOString() };
    const result = await signUp(pendingSignupEmail, pendingSignupPassword, waiverInfo);
    if (result.needsConfirmation) {
      waiverEl.panel.style.display = 'none';
      document.getElementById('authPanel').style.display = 'block';
      setAuthMode('signin');
      // Deliberately doesn't say "an email was just sent" -- Supabase's
      // signup response is identical whether this is a genuinely new
      // address or one that already has an account (a deliberate anti-
      // enumeration measure on their end: revealing "that email's
      // already registered" would itself be a real privacy leak, so
      // there's no reliable signal here to tell the two cases apart).
      // Confirmed live (Rick, 2026-08-28): re-submitting an already-
      // registered, already-confirmed email silently no-ops -- no new
      // mail actually goes out -- so a message asserting one was just
      // sent would be false in that case. This wording stays true
      // either way instead of guessing which case just happened.
      flash(authOkEl, "If that's a new email, check it for a verification link to finish setup. Already have an account? Just sign in below.");
    } else {
      await init();
    }
  } catch (e) {
    flash(waiverEl.error, e.message);
    waiverEl.acceptBtn.disabled = false;
  }
});

signUpBtn.addEventListener('click', async () => {
  hide(authOkEl); hide(authErrorEl);
  const email = authEmailInput.value.trim();
  const password = authPasswordInput.value;
  if (!email || !password) { flash(authErrorEl, 'Enter both email and password.'); return; }
  if (password.length < 6) { flash(authErrorEl, 'Password must be at least 6 characters.'); return; }
  pendingSignupEmail = email;
  pendingSignupPassword = password;
  await showWaiverPanel();
});

signOutBtn.addEventListener('click', () => {
  clearSession();
  showAuthPanel();
});

// ---------------------------------------------------------- walkthrough
// Static pre-generated narration (ballistica/web/audio/, same Shimmer
// voice as live solutions) -- not live TTS per playback, this content
// never changes per user. Metadata mirrors ballistica/walkthrough.py;
// kept as a small hardcoded list here rather than fetched, unlike the
// waiver's text -- there's no hashing/versioning concern for this, just
// four fixed (key, title) pairs.
const WALKTHROUGH_SECTIONS = [
  { key: 'walkthrough-1-getting-started', title: 'Getting Started' },
  { key: 'walkthrough-2-rifle-setup', title: 'Rifle and Equipment Setup' },
  { key: 'walkthrough-3-load-and-velocity', title: 'Checking a Load and Velocity' },
  { key: 'walkthrough-4-long-range-and-spotting', title: 'Long Range Shooting and Spotting' },
];

function renderWalkthroughMenu() {
  const list = document.getElementById('walkthroughList');
  list.innerHTML = WALKTHROUGH_SECTIONS.map((s) => `
    <div style="margin-bottom:14px;">
      <div style="font-weight:600; margin-bottom:4px;">${escapeHtml(s.title)}</div>
      <audio controls preload="none" style="width:100%;" src="/audio/${s.key}.mp3"></audio>
    </div>
  `).join('');
}

// Fires at most once ever per account -- checked against the server
// (GET /v2/walkthrough-status), not just localStorage, so it's reliable
// across devices/browsers and survives a cleared cache. Deliberately
// marks the account as having heard it the moment playback is kicked
// off, not after playback finishes -- otherwise closing the tab mid-
// playback (or a blocked-autoplay browser rejecting .play()) would
// leave it eligible to fire again on the very next login, which is
// exactly the double-fire/repeat behavior this isn't supposed to have.
async function maybeAutoPlayFirstWalkthrough(accessToken) {
  try {
    const res = await fetch('/v2/walkthrough-status', {
      headers: { Authorization: `Bearer ${accessToken}` },
    });
    if (!res.ok) return;
    const status = await res.json();
    if (status.first_walkthrough_played_at) return; // already heard it -- never again

    // Fire-and-forget: don't let a slow/failed mark-first-played call
    // delay showing the app, and don't let it block playback either.
    fetch('/v2/walkthrough/mark-first-played', {
      method: 'POST', headers: { Authorization: `Bearer ${accessToken}` },
    }).catch(() => {});

    const first = WALKTHROUGH_SECTIONS[0];
    const audio = new Audio(`/audio/${first.key}.mp3`);
    audio.play().catch(() => {
      // Autoplay blocked (no direct user gesture in this call chain) --
      // already marked heard above, so it won't retry on the next
      // login; the section is still reachable anytime from the menu.
    });
  } catch (e) {
    // Network error -- not fatal to signing in; worst case this
    // account's first-login walkthrough just doesn't auto-play once.
  }
}

// Single entry point for "we have (or just got) a valid session -- go
// load the app's actual data." Called at page load and again right
// after a successful sign-in/sign-up so both paths converge here
// instead of duplicating the loadRifles() kickoff.
async function init() {
  const authed = await requireAuth();
  if (!authed) return;
  renderWalkthroughMenu();
  const token = await getValidAccessToken();
  if (token) await maybeAutoPlayFirstWalkthrough(token);
  await loadRifles();
}
init();
</script>
</body>
</html>
