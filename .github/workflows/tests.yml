# Runs the test suite and the Python/JavaScript engine parity check on every
# push and pull request.
#
# No secrets are used. Tests that need the live Supabase project or a paid
# Claude call skip themselves when those credentials aren't configured (see
# tests/conftest.py), so this covers the engine, the voice command logic and
# the API layer -- not the live-database tenant-isolation tests, which still
# only run locally.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Offline engine matches the Python engine
        run: node scripts/check_engine_parity.js
